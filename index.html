<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salesforce Certified Integration Architect Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>

</head>
<body>
  <header class="bg-indigo-900 text-white p-2 flex justify-between items-center">
    <h1 class="text-lg font-semibold">Salesforce Certified Integration Architect Quiz</h1>
    <div class="progress text-base" id="progress">
      Question 1 of 65
    </div>
  </header>
  <div class="main-container" id="quiz-container">
    <div class="mark-btn">
      <input type="checkbox" id="mark-checkbox"> <label for="mark-checkbox">Mark</label>
    </div>
    <div class="question-text text-lg font-medium mb-4" id="question-text"></div>
    <div id="options" class="options"></div>
    <div class="feedback mt-4 p-4 rounded hidden" id="feedback"></div>
  </div>
  <div class="main-container hidden" id="review-container">
    <h2 class="text-xl font-bold mb-4">Review Answers</h2>
    <div id="review-summary" class="mb-4"></div>
    <div id="review-details"></div>
  </div>
  <div class="main-container hidden" id="list-container">
    <h2 class="text-xl font-bold mb-4">Question List</h2>
    <div id="list-details"></div>
  </div>
  <div class="main-container hidden" id="results-container">
    <h2 class="text-xl font-bold mb-4">Quiz Results</h2>
    <div id="results-summary" class="mb-4"></div>
    <div id="results-details"></div>
  </div>
  <footer class="footer">
    <div>
      <button id="prev-btn" class="bg-blue-600 text-white px-4 py-2 rounded font-medium hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed" disabled>Previous</button> <button id="next-btn" class="bg-blue-600 text-white px-4 py-2 rounded font-medium hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed">Next</button>
    </div>
    <div>
      <button id="review-btn" class="bg-amber-500 text-white px-4 py-2 rounded font-medium hover:bg-amber-600 mr-2">Review</button> <button id="show-answer-btn" class="bg-gray-600 text-white px-4 py-2 rounded font-medium hover:bg-gray-700 mr-2">Show Answer</button> <button id="show-list-btn" class="bg-gray-600 text-white px-4 py-2 rounded font-medium hover:bg-gray-700 mr-2">Show List</button>
    </div>
    <div>
      <button id="save-session-btn" class="bg-blue-600 text-white px-4 py-2 rounded font-medium hover:bg-blue-700 mr-2">Save Session</button> <button id="end-exam-btn" class="bg-blue-600 text-white px-4 py-2 rounded font-medium hover:bg-blue-700">End Exam</button>
    </div>
  </footer>
</body>
</html>
