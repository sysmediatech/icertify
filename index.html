  <script>
    // Continuing the questions array from ID 55
    const questions = [
      {
        id: 1,
        text: "Northern Trail Outfitters requires an integration to be set up between one of its Salesforce orgs and an External Data Source using Salesforce Connect. The External Data Source supports Open Data Protocol. Which configuration could an integration architect recommend be implemented in order to secure requests coming from Salesforce?",
        options: [
          { value: "A", text: "Configure a certificate for OData connection." },
          { value: "B", text: "Configure Identity Type for OData connection." },
          { value: "C", text: "Configure Special Compatibility for OData connection." }
        ],
        correct: "A",
        multiple: false,
        explanation: "Salesforce Connect uses OData to connect to external data sources. To secure requests, using a certificate for the OData connection ensures that communication is encrypted via SSL/TLS, providing a secure channel for data exchange.",
        incorrectExplanations: {
          "B": "Identity Type is more related to authentication mechanisms rather than securing the communication channel, which is the primary concern here.",
          "C": "Special Compatibility is a vague option and not a standard Salesforce Connect configuration for securing requests."
        }
      },
      {
        id: 2,
        text: "Northern Trail Outfitters (NTO) uses a custom mobile app to interact with its customers. One of the features of the app is Salesforce Chatter Feeds. NTO wants to automatically post a Chatter item to Twitter whenever the post includes the #thanksNTO hashtag. Which API should an integration architect use to meet this requirement?",
        options: [
          { value: "A", text: "Streaming API to generate PushTopic" },
          { value: "B", text: "Connect REST API" },
          { value: "C", text: "REST API" }
        ],
        correct: "C",
        multiple: false,
        explanation: "The REST API is the most appropriate choice for posting to an external system like Twitter when a specific action (Chatter post with a hashtag) occurs. You can use the REST API to create a Chatter post and then call an external Twitter API to post the message.",
        incorrectExplanations: {
          "A": "The Streaming API is better suited for real-time notifications, not for posting actions to external systems like Twitter.",
          "B": "The Connect REST API is more suited for community-related integrations, not for Chatter-to-Twitter posting."
        }
      },
      {
        id: 3,
        text: "Northern Trail Outfitters has recently implemented middleware for orchestration of services across platforms. The Enterprise Resource Planning (ERP) system being used requires transactions be captured near real time at a REST endpoint initiated in Salesforce when creating an Order object. Additionally, the Salesforce team has limited development resources and requires a low-code solution. Which option should fulfill the use case requirements?",
        options: [
          { value: "A", text: "Implement a Workflow Rule with Outbound Messaging to send SOAP messages to the designated endpoint." },
          { value: "B", text: "Use Remote Process Invocation Fire and Forget pattern on insert on the Order object using Flow Builder." },
          { value: "C", text: "Implement Change Data Capture on the Order object and leverage the replay ID in the middleware solution." }
        ],
        correct: "B",
        multiple: false,
        explanation: "The requirement for near real-time updates and a low-code solution points to using Salesforce Flow Builder with the Remote Process Invocation Fire and Forget pattern. This allows Salesforce to trigger an external REST call asynchronously without custom code, fitting the low-code constraint.",
        incorrectExplanations: {
          "A": "Workflow Rules with Outbound Messaging use SOAP, which isn’t ideal for REST endpoints, and may not meet the near real-time requirement as effectively.",
          "C": "Change Data Capture is more suited for event-driven architectures rather than immediate REST calls triggered by record creation."
        }
      },
      {
        id: 4,
        text: "A subscription-based media company's system landscape forces many subscribers to maintain multiple accounts and to log in more than once. An Identity and Access Management (IAM) system, which supports SAML and OpenId, was recently implemented to improve the subscriber experience through self-registration and single sign-on (SSO). The IAM system must integrate with Salesforce to give new self-service customers instant access to Salesforce Community Cloud. Which requirement should Salesforce Community Cloud support for self-registration and SSO?",
        options: [
          { value: "A", text: "OpenId Connect Authentication Provider and Registration Handler" },
          { value: "B", text: "SAML SSO and Registration Handler" },
          { value: "C", text: "OpenId Connect Authentication Provider and Justin-Time (JIT) provisioning" }
        ],
        correct: "C",
        multiple: false,
        explanation: "OpenId Connect is a modern authentication protocol supported by Salesforce for SSO, and JIT provisioning allows new users to be created instantly upon login, meeting the requirement for instant access.",
        incorrectExplanations: {
          "A": "While OpenId Connect is correct, a Registration Handler alone doesn’t support instant user creation like JIT provisioning does.",
          "B": "SAML is supported, but it doesn’t leverage OpenId Connect, which the IAM system also supports, and lacks JIT provisioning for instant access."
        }
      },
      {
        id: 5,
        text: "The URL for an external service has been changed without prior notice. The service provides up-to-date money exchange rates that are accessed several times from Salesforce and are a business-critical function for end users. Which solutions should an integration architect recommend be implemented to minimize potential downtime for users in this situation?",
        options: [
          { value: "A", text: "Named Credentials and Content Security Policies" },
          { value: "B", text: "Remote Site Settings and Named Credentials" },
          { value: "C", text: "Enterprise Service Bus (ESB) and Remote Site Settings" }
        ],
        correct: "B",
        multiple: false,
        explanation: "Named Credentials allow you to store and manage external service URLs securely, making it easy to update the URL without code changes, thus minimizing downtime. Remote Site Settings are required to allow Salesforce to make callouts to the external endpoint.",
        incorrectExplanations: {
          "A": "Content Security Policies are more relevant for browser security than for managing callout URLs or minimizing downtime.",
          "C": "Using an ESB adds unnecessary complexity for this use case, which can be handled more directly with Named Credentials."
        }
      },
      {
        id: 6,
        text: "An integration architect has built a Salesforce application that integrates multiple systems and keeps them synchronized via Platform Events. What is taking place if events are only being published?",
        options: [
          { value: "A", text: "The platform events are published immediately before the Apex transaction completes." },
          { value: "B", text: "The platform events are published after the Apex transaction completes." },
          { value: "C", text: "The platform events are being published from Apex." }
        ],
        correct: "B",
        multiple: false,
        explanation: "Platform Events are published after the Apex transaction completes successfully, ensuring data consistency.",
        incorrectExplanations: {
          "A": "Events are not published before the transaction completes; they are queued and published post-commit to ensure reliability.",
          "C": "This option is vague and doesn’t address the timing of the publication, which is the core of the question."
        }
      },
      {
        id: 7,
        text: "Universal Containers (UC) is currently managing a custom monolithic web service that runs on an on-premise server. This monolithic web service is responsible for Point-to-Point (P2P) integrations between: 1. Salesforce and a legacy billing application, 2. Salesforce and a cloud-based Enterprise Resource Planning (ERP) application, 3. Salesforce and a data lake. UC has found that the tight interdependencies between systems are causing integrations to fail. What should an integration architect recommend to decouple the systems and improve the performance of the integrations?",
        options: [
          { value: "A", text: "Move the custom monolithic web service from on-premise to a cloud provider." },
          { value: "B", text: "Leverage modular design by breaking up the web service into smaller pieces for a microservice architecture." },
          { value: "C", text: "Use the Salesforce Bulk API when integrating back into Salesforce." }
        ],
        correct: "B",
        multiple: false,
        explanation: "Breaking the monolithic web service into a microservice architecture decouples the systems, reducing interdependencies and improving scalability and performance.",
        incorrectExplanations: {
          "A": "Moving to a cloud provider doesn’t address the core issue of tight coupling within the monolithic service.",
          "C": "The Bulk API is irrelevant for decoupling integrations; it’s designed for high-volume data operations, not system architecture."
        }
      },
      {
        id: 8,
        text: "Universal Containers (UC) has embarked on a Salesforce transformation journey. UC will decommission its legacy CRM system and migrate data to Salesforce. The data migration team asked for a recommendation to optimize the performance of the data load to Salesforce. Which approach should be used to meet the requirement?",
        options: [
          { value: "A", text: "Use Bulk API to process jobs in serial mode." },
          { value: "B", text: "Contact Salesforce Support to schedule performance load." },
          { value: "C", text: "Use Bulk API to process jobs in parallel mode." }
        ],
        correct: "C",
        multiple: false,
        explanation: "The Bulk API in parallel mode is designed for high-volume data loads, optimizing performance by processing multiple batches concurrently.",
        incorrectExplanations: {
          "A": "Serial mode is slower and less efficient for large datasets, as it processes batches sequentially.",
          "B": "Contacting Salesforce Support for a performance load is unnecessary, as Bulk API is a standard feature available for use."
        }
      },
      {
        id: 9,
        text: "A Salesforce customer is planning to roll out Salesforce for all of their sales and service staff. Senior management has requested that monitoring be in place for Operations to notify any degradation in Salesforce performance. How should an integration consultant implement monitoring?",
        options: [
          { value: "A", text: "Identify critical business processes and establish automation to monitor performance against established benchmarks." },
          { value: "B", text: "Use APIEVENT to track all user-initiated API calls through SOAP, REST, or Bulk API." },
          { value: "C", text: "Use Salesforce API Limits to capture current API usage and configure alerts for monitoring." }
        ],
        correct: "A",
        multiple: false,
        explanation: "Monitoring critical business processes with automation ensures proactive detection of performance degradation, aligning with operational needs.",
        incorrectExplanations: {
          "B": "APIEVENT is more suited for auditing API usage, not for monitoring performance degradation directly.",
          "C": "API Limits focus on usage limits rather than performance degradation, making this option less relevant."
        }
      },
      {
        id: 10,
        text: "A large consumer goods manufacturer operating in multiple countries is planning to implement Salesforce for its sales and support operations globally. The manufacturer has the following security requirements: 1. Internal users from each country have to be authenticated with their local active directory. 2. Customers can create their own login or use Google login. 3. Partners have to be authenticated through a central system which is to be determined. 4. Internal users will have access to the central Enterprise Resource Planning (ERP) with their credentials maintained in the ERP system. 5. Additional internal systems will be integrated with Salesforce for sales and support business processes. Which requirement should the integration architect evaluate while designing the integration needs of this project?",
        options: [
          { value: "A", text: "Evaluate the build of a custom authentication mechanism for users in each country and support for customers and partners." },
          { value: "B", text: "Evaluate Salesforce native authentication mechanism for all users including customers and partners." },
          { value: "C", text: "Consider a third-party single sign-on (SSO) solution supporting all user authentication including customer and partner." }
        ],
        correct: "C",
        multiple: false,
        explanation: "A third-party SSO solution supporting SAML or OpenId Connect can handle diverse authentication needs (local Active Directory, Google login, central system for partners) and integrate with ERP credentials, providing a unified authentication framework.",
        incorrectExplanations: {
          "A": "Building a custom authentication mechanism for each country is complex and resource-intensive, not scalable for diverse user types.",
          "B": "Salesforce native authentication mechanisms may not fully support integration with local Active Directories or a to-be-determined partner system."
        }
      },
      {
        id: 11,
        text: "Universal Containers (UC) is a large printing company that sells advertisement banners. The company works with third-party agents on banner initial design concepts. The design files are stored in an on-premise file store that can be accessed by UC internal users and third-party agencies. UC would like to collaborate with the third-party agencies on the design files and allow them to view the design files in the community. The conceptual design files size is 2.5 GB. Which solution should an integration architect recommend?",
        options: [
          { value: "A", text: "Use Salesforce Files to link the files to Salesforce records and display the record and the files in the community." },
          { value: "B", text: "Create a custom object to store the file location URL; when a community user clicks on the file URL, redirect the user to the on-premise system file location." },
          { value: "C", text: "Create a Lightning component with a Request and Reply integration pattern to allow the community users to download the design files." }
        ],
        correct: "A",
        multiple: false,
        explanation: "Salesforce Files (Content Documents) can handle large files (up to 2GB in communities) and allows linking files to records, making them accessible in the community for collaboration.",
        incorrectExplanations: {
          "B": "Redirecting to an on-premise system via URL may pose security risks and requires additional authentication handling, making it less seamless.",
          "C": "A custom Lightning component with Request and Reply adds unnecessary complexity for a file-sharing use case that Salesforce Files can handle natively."
        }
      },
      {
        id: 12,
        text: "An integration architect has been tasked with integrating Salesforce with an on-premises system. Due to some established policies, this system must remain on-premises. What should the integration architect use to build a solution for this requirement?",
        options: [
          { value: "A", text: "Use Salesforce Connect if the database supports Open Database Connectivity (ODBC)." },
          { value: "B", text: "Use Heroku Connect if the data is hosted in Heroku." },
          { value: "C", text: "Use Salesforce Connect if the database supports Open Data Protocol (OData)." }
        ],
        correct: "C",
        multiple: false,
        explanation: "Salesforce Connect with OData support allows seamless integration with on-premises systems by exposing data as external objects, aligning with the requirement to keep the system on-premises.",
        incorrectExplanations: {
          "A": "While ODBC is supported by Salesforce Connect, OData is a more modern and widely used protocol for such integrations.",
          "B": "Heroku Connect is irrelevant since the system must remain on-premises, not hosted in Heroku."
        }
      },
      {
        id: 13,
        text: "Which Web Services Description Language (WSDL) should an architect consider when creating an integration that might be used for more than one Salesforce org and different metadata?",
        options: [
          { value: "A", text: "Partner WSDL" },
          { value: "B", text: "SOAP API WSDL" },
          { value: "C", text: "Enterprise WSDL" }
        ],
        correct: "A",
        multiple: false,
        explanation: "The Partner WSDL is loosely typed and designed to work across multiple Salesforce orgs with different metadata, making it ideal for generic integrations.",
        incorrectExplanations: {
          "B": "SOAP API WSDL is a vague option; it’s not a specific type like Partner or Enterprise WSDL.",
          "C": "Enterprise WSDL is tightly coupled to a specific org’s metadata, making it less suitable for multiple orgs with different metadata."
        }
      },
      {
        id: 14,
        text: "A customer is evaluating the Platform Events solution and would like help in comparing/contrasting it with Outbound Messaging for real-time/near-real time needs. They expect 3,000 customers to view messages in Salesforce. What should be evaluated and highlighted when deciding between the solutions?",
        options: [
          { value: "A", text: "Both Platform Events and Outbound Messaging are highly scalable. However, unlike Outbound Messaging, only Platform Events have Event Delivery and Event Publishing limits to be considered." },
          { value: "B", text: "In both Platform Events and Outbound Messaging, the event messages are retried by and delivered in sequence, and only once. Salesforce ensures there is no duplicate message delivery." },
          { value: "C", text: "Message sequence is possible in Outbound Messaging, but not guaranteed with Platform Events. Both offer very high reliability. Fault handling and recovery are fully handled by Salesforce." }
        ],
        correct: "A",
        multiple: false,
        explanation: "Platform Events have specific limits (e.g., Event Delivery and Publishing limits) that need to be considered for scalability, especially with 3,000 customers, whereas Outbound Messaging does not have these limits but is less suited for real-time needs.",
        incorrectExplanations: {
          "B": "Outbound Messaging ensures sequence and no duplicates, but Platform Events do not guarantee sequence and may have duplicates if not handled properly.",
          "C": "While Outbound Messaging supports message sequencing, Platform Events can also maintain sequence with proper design (e.g., using replay IDs), making this option partially incorrect."
        }
      },
      {
        id: 15,
        text: "Northern Trail Outfitters (NTO) uses Salesforce to track leads, opportunities, and order details that convert leads to customers. However, orders are managed by an external (remote) system. Sales reps want to view up-to-date real-time order information in Salesforce. NTO wants the data to only persist in the external system. Which type of integration should meet this business requirement?",
        options: [
          { value: "A", text: "Data Synchronization" },
          { value: "B", text: "Data Virtualization" },
          { value: "C", text: "Process Orchestration" }
        ],
        correct: "B",
        multiple: false,
        explanation: "Data Virtualization, using tools like Salesforce Connect, allows real-time access to external data without storing it in Salesforce, meeting the requirement to keep data in the external system.",
        incorrectExplanations: {
          "A": "Data Synchronization would involve copying data into Salesforce, which contradicts the requirement to persist data only in the external system.",
          "C": "Process Orchestration focuses on coordinating business processes, not on real-time data access without persistence."
        }
      },
      {
        id: 16,
        text: "A company needs to be able to send data from Salesforce to a homegrown system behind a corporate firewall. The data needs to be pushed only one way and doesn't need to be sent in real time. The average volume is 2 million records per day. What should an integration architect consider when choosing the right option in building the integration between the external system and Salesforce?",
        options: [
          { value: "A", text: "Due to high volume of records, the external system will need to use a BULK API Rest endpoint to connect to Salesforce." },
          { value: "B", text: "Due to high volume of records, number of concurrent requests can hit the limit for the REST API call to the external system." },
          { value: "C", text: "Due to high volume of records, a third-party integration tool is required to stage records off platform." }
        ],
        correct: "B",
        multiple: false,
        explanation: "For high-volume data pushes (2 million records per day), the number of concurrent REST API requests to the external system could hit limits, requiring careful throttling or batching strategies.",
        incorrectExplanations: {
          "A": "The Bulk API is for loading data into Salesforce, not for the external system to receive data, making this option incorrect.",
          "C": "A third-party tool isn’t necessarily required; Salesforce can handle this volume with proper design (e.g., batching REST calls)."
        }
      },
      {
        id: 17,
        text: "Universal Containers (UC) is a global financial company that sells financial products and services including bank accounts, loans, and insurance. UC uses Salesforce Service Cloud to service its customers via calls and live chat. Support agents open bank accounts on the spot for customers who inquire about UC bank accounts. UC's core banking system is the system of record for bank accounts, and all accounts opened in Salesforce have to be synced in real time to the core banking system. Support agents need to inform the customers with the newly created bank account ID, which has to be generated from the core banking system. Which integration pattern is recommended?",
        options: [
          { value: "A", text: "Salesforce platform events" },
          { value: "B", text: "Request and Reply" },
          { value: "C", text: "Streaming API to generate PushTopic" }
        ],
        correct: "B",
        multiple: false,
        explanation: "The Request and Reply pattern is ideal for real-time synchronous calls where Salesforce needs to send a request to the core banking system and receive a response (the bank account ID) immediately.",
        incorrectExplanations: {
          "A": "Platform Events are better for asynchronous, event-driven integrations, not for real-time synchronous responses.",
          "C": "Streaming API with PushTopic is for real-time notifications, not for request-reply scenarios."
        }
      },
      {
        id: 18,
        text: "Northern Trail Outfitters is creating a distributable Salesforce package for other Salesforce orgs within the company. The package needs to call into a custom Apex REST endpoint in the central org. The security team wants to ensure a specific integration account is used in the central org that they will authorize after installation of the package. Which item should an architect recommend to secure the integration in the package?",
        options: [
          { value: "A", text: "Use an encrypted field to store the password that the security team enters, and use password management for external orgs and set the encryption method to TLS 1.2." },
          { value: "B", text: "Contact Salesforce Support and create a case to temporarily enable API access for managed packages." },
          { value: "C", text: "Create an authentication provider in the package and set the consumer key and consumer secret of the connected app in the central org." }
        ],
        correct: "C",
        multiple: false,
        explanation: "Using an authentication provider with a connected app allows the package to securely authenticate using a specific integration account, which the security team can authorize.",
        incorrectExplanations: {
          "A": "Storing passwords in encrypted fields is not a secure or recommended practice for integrations; Named Credentials or connected apps are better.",
          "B": "Contacting Salesforce Support to enable API access is unnecessary and not a scalable solution for managed packages."
        }
      },
      {
        id: 19,
        text: "The director of customer service at Northern Trail Outfitters wants to capture and trend specific business events that occur in Salesforce in real time. The metrics will be accessed in an ad-hoc manner using an external analytics system. The events are as follows: 1. A customer initiates a product exchange via a Case. 2. A customer service rep clicks on the 'Authorize Exchange Product' menu item in the Case. 3. A customer initiates a subscription cancellation via a Case. 4. A customer service rep clicks on the 'Initiate Refund' menu item in the Case. Which solution should meet these business requirements?",
        options: [
          { value: "A", text: "Case Workflow Rule that sends an Outbound Message" },
          { value: "B", text: "Case after insert Trigger that executes a callout" },
          { value: "C", text: "Case Trigger after Insert, after update to publish the platform event" }
        ],
        correct: "C",
        multiple: false,
        explanation: "Using a Case Trigger to publish Platform Events allows real-time capture of events (inserts and updates) and integration with an external analytics system via event subscription.",
        incorrectExplanations: {
          "A": "Outbound Messaging is asynchronous but less flexible for real-time event streaming compared to Platform Events.",
          "B": "A direct callout from a trigger can lead to governor limit issues and isn’t ideal for real-time event publishing."
        }
      },
      {
        id: 20,
        text: "A global financial company sells financial products and services that include: 1. Bank accounts, 2. Loans, 3. Insurance. The company has a state-of-the-art core banking system that is the master system to store financial transactions, financial products, and customer information. The core banking system currently processes 1 million financial transactions per day. The CTO for the company is considering building a community portal so that customers can review their bank account details, update their information, and review the financial transactions. What should an integration architect recommend as a solution to enable customer community users to view their financial transactions?",
        options: [
          { value: "A", text: "Migrate the financial transaction records to a Salesforce custom object and use an extract, transform, and load (ETL) tool to keep systems in sync." },
          { value: "B", text: "Use Salesforce Connect to display the financial transactions as an external object." },
          { value: "C", text: "Use Iframe to display core banking financial transactions data in the customer community." }
        ],
        correct: "B",
        multiple: false,
        explanation: "Salesforce Connect with external objects allows community users to view financial transactions in real-time without migrating data into Salesforce, keeping the core banking system as the master.",

    let currentQuestionIndex = 0;
    const selectedAnswers = {};
    const correctAnswers = {};
    const markedQuestions = new Set();

    function loadQuestion(index) {
      const question = questions[index];
      document.getElementById('progress').textContent = `Question ${index + 1} of ${questions.length}`;
      document.getElementById('question-text').textContent = question.text;

      const optionsContainer = document.getElementById('options');
      optionsContainer.innerHTML = '';

      question.options.forEach(option => {
        const div = document.createElement('div');
        div.className = 'option';
        const inputType = question.multiple ? 'checkbox' : 'radio';
        const input = document.createElement('input');
        input.type = inputType;
        input.name = 'option';
        input.value = option.value;
        input.id = `option-${option.value}`;
        if (question.multiple) {
          input.checked = selectedAnswers[index]?.includes(option.value) || false;
        } else {
          input.checked = selectedAnswers[index] === option.value;
        }
        const label = document.createElement('label');
        label.htmlFor = `option-${option.value}`;
        label.textContent = option.text;
        div.appendChild(input);
        div.appendChild(label);

        // Add click event to the entire option div
        div.addEventListener('click', (e) => {
          // Prevent double-triggering if the input or label is clicked directly
          if (e.target === input || e.target === label) return;

          if (question.multiple) {
            input.checked = !input.checked;
            if (!selectedAnswers[index]) selectedAnswers[index] = [];
            if (input.checked) {
              selectedAnswers[index].push(option.value);
            } else {
              selectedAnswers[index] = selectedAnswers[index].filter(val => val !== option.value);
            }
          } else {
            // For single-choice, uncheck other options and check the clicked one
            document.querySelectorAll(`input[name="option"]`).forEach(opt => {
              opt.checked = false;
            });
            input.checked = true;
            selectedAnswers[index] = option.value;
          }
          showFeedback(index);
        });

        // Handle direct input changes (for accessibility)
        input.addEventListener('change', () => {
          if (question.multiple) {
            if (!selectedAnswers[index]) selectedAnswers[index] = [];
            if (input.checked) {
              selectedAnswers[index].push(option.value);
            } else {
              selectedAnswers[index] = selectedAnswers[index].filter(val => val !== option.value);
            }
          } else {
            selectedAnswers[index] = option.value;
          }
          showFeedback(index);
        });

        optionsContainer.appendChild(div);
      });

      const feedback = document.getElementById('feedback');
      feedback.style.display = 'none';

      document.getElementById('mark-checkbox').checked = markedQuestions.has(index);
      document.getElementById('prev-btn').disabled = index === 0;
      document.getElementById('next-btn').disabled = index === questions.length - 1;
    }

    function showFeedback(index) {
      const question = questions[index];
      const userAnswer = selectedAnswers[index];
      const feedback = document.getElementById('feedback');

      if (!userAnswer) {
        feedback.textContent = 'Please select an answer.';
        feedback.className = 'feedback mt-4 p-4 rounded bg-red-100 text-red-800';
        feedback.style.display = 'block';
        return false;
      }

      let isCorrect;
      let userAnswerText;
      const correctAnswerText = question.multiple
        ? question.correct.map(val => question.options.find(opt => opt.value === val).text).join(', ')
        : question.options.find(opt => opt.value === question.correct).text;

      if (question.multiple) {
        const sortedUserAnswer = userAnswer.slice().sort();
        const sortedCorrectAnswer = question.correct.slice().sort();
        isCorrect = sortedUserAnswer.length === sortedCorrectAnswer.length &&
                   sortedUserAnswer.every((val, i) => val === sortedCorrectAnswer[i]);
        userAnswerText = userAnswer.map(val => question.options.find(opt => opt.value === val).text).join(', ');
      } else {
        isCorrect = userAnswer === question.correct;
        userAnswerText = question.options.find(opt => opt.value === userAnswer).text;
      }

      correctAnswers[index] = isCorrect;

      if (isCorrect) {
        feedback.textContent = `Correct! Your answer: ${userAnswerText}. Explanation: ${question.explanation}`;
        feedback.className = 'feedback mt-4 p-4 rounded bg-green-100 text-green-800';
      } else {
        const incorrectExplanation = question.multiple

        feedback.className = 'feedback mt-4 p-4 rounded bg-red-100 text-red-800';
      }
      feedback.style.display = 'block';
      return true;

    function showAnswer(index) {
      const question = questions[index];
      const feedback = document.getElementById('feedback');
      const correctAnswerText = question.multiple
        ? question.correct.map(val => question.options.find(opt => opt.value === val).text).join(', ')
        : question.options.find(opt => opt.value === question.correct).text;
      feedback.textContent = `Correct Answer: ${correctAnswerText}. ${question.explanation}`;
      feedback.className = 'feedback mt-4 p-4 rounded bg-green-100 text-green-800';
      feedback.style.display = 'block';
    }

    function showReview() {
      const quizContainer = document.getElementById('quiz-container');
      const reviewContainer = document.getElementById('review-container');
      const listContainer = document.getElementById('list-container');
      quizContainer.className = 'main-container hidden';
      listContainer.className = 'main-container hidden';
      reviewContainer.className = 'main-container';

      const attempted = Object.keys(selectedAnswers).length;
      const remaining = questions.length - attempted;
      document.getElementById('review-summary').innerHTML = `
        <p class="text-lg font-semibold">Attempted: ${attempted} questions</p>
        <p>Remaining: ${remaining} questions</p>
        <p>Marked: ${markedQuestions.size} questions</p>
      `;

      const details = document.getElementById('review-details');
      details.innerHTML = '';
      questions.forEach((question, index) => {
        const userAnswer = selectedAnswers[index] || 'Not Answered';
        const userAnswerText = question.multiple
          ? (Array.isArray(userAnswer) ? userAnswer.map(val => question.options.find(opt => opt.value === val).text).join(', ') : userAnswer)
          : question.options.find(opt => opt.value === userAnswer)?.text || userAnswer;
        details.innerHTML += `
          <div class="mb-4 p-4 border rounded">
            <p><strong>Question ${index + 1}:</strong> ${question.text}</p>
            <p><strong>Your Answer:</strong> ${userAnswerText}</p>
            ${markedQuestions.has(index) ? '<p><strong>Marked:</strong> Yes</p>' : ''}
          </div>
        `;
      });
    }

    function showList() {
      const quizContainer = document.getElementById('quiz-container');
      const reviewContainer = document.getElementById('review-container');
      const listContainer = document.getElementById('list-container');
      quizContainer.className = 'main-container hidden';
      reviewContainer.className = 'main-container hidden';
      listContainer.className = 'main-container';

      const details = document.getElementById('list-details');
      details.innerHTML = '';
      questions.forEach((question, index) => {
        const status = selectedAnswers[index] ? 'Answered' : 'Unanswered';
        const marked = markedQuestions.has(index) ? 'Marked' : '';
        details.innerHTML += `
          <div class="list-item mb-4 p-4 border rounded">
            <p>Question ${index + 1}: ${question.text.substring(0, 50)}...</p>
            <div class="status">
              <span>${status}</span>
              ${marked ? '<span class="marked ml-2">' + marked + '</span>' : ''}
            </div>
          </div>
        `;
      });
    }

    function showResults() {
      const quizContainer = document.getElementById('quiz-container');
      const reviewContainer = document.getElementById('review-container');
      const listContainer = document.getElementById('list-container');
      const resultsContainer = document.getElementById('results-container');
      quizContainer.className = 'main-container hidden';
      reviewContainer.className = 'main-container hidden';
      listContainer.className = 'main-container hidden';
      resultsContainer.className = 'main-container';

      let correctCount = Object.values(correctAnswers).filter(val => val).length;
      let totalQuestions = questions.length;
      let percentage = ((correctCount / totalQuestions) * 100).toFixed(2);

      document.getElementById('results-summary').innerHTML = `
        <p class="text-lg font-semibold">You scored ${correctCount} out of ${totalQuestions} (${percentage}%)</p>
        <p>${percentage >= 70 ? 'Congratulations, you passed!' : 'You need more practice.'}</p>
      `;

      const details = document.getElementById('results-details');
      details.innerHTML = '';
      questions.forEach((question, index) => {
        const userAnswer = selectedAnswers[index] || 'Not Answered';
        const isCorrect = correctAnswers[index];
        const userAnswerText = question.multiple
          ? (Array.isArray(userAnswer) ? userAnswer.map(val => question.options.find(opt => opt.value === val).text).join(', ') : userAnswer)
          : question.options.find(opt => opt.value === userAnswer)?.text || userAnswer;
        const correctAnswerText = question.multiple
          ? question.correct.map(val => question.options.find(opt => opt.value === val).text).join(', ')
          : question.options.find(opt => opt.value === question.correct).text;
        details.innerHTML += `
          <div class="mb-4 p-4 border rounded ${isCorrect ? 'bg-green-100' : 'bg-red-100'}">
            <p><strong>Question ${index + 1}:</strong> ${question.text}</p>
            <p><strong>Your Answer:</strong> ${userAnswerText}</p>
            <p><strong>Correct Answer:</strong> ${correctAnswerText}</p>
            <p><strong>Explanation:</strong> ${question.explanation}</p>
            ${markedQuestions.has(index) ? '<p><strong>Marked:</strong> Yes</p>' : ''}
          </div>
        `;
      });
    }

    document.getElementById('mark-checkbox').addEventListener('change', (e) => {
      if (e.target.checked) {
        markedQuestions.add(currentQuestionIndex);
      } else {
        markedQuestions.delete(currentQuestionIndex);
      }
    });

    document.getElementById('next-btn').addEventListener('click', () => {
      if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        loadQuestion(currentQuestionIndex);
      }
    });

    document.getElementById('prev-btn').addEventListener('click', () => {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        loadQuestion(currentQuestionIndex);
      }
    });

    document.getElementById('review-btn').addEventListener('click', () => {
      showReview();
    });

    document.getElementById('show-answer-btn').addEventListener('click', () => {
      showAnswer(currentQuestionIndex);
    });

    document.getElementById('show-list-btn').addEventListener('click', () => {
      showList();
    });

    document.getElementById('save-session-btn').addEventListener('click', () => {
      console.log('Session saved:', { selectedAnswers, markedQuestions });
      alert('Session saved! (Check console for details)');
    });

    document.getElementById('end-exam-btn').addEventListener('click', () => {
      const attempted = Object.keys(selectedAnswers).length;
      const remaining = questions.length - attempted;
      const confirmSubmit = confirm(`You have attempted ${attempted} questions. ${remaining} questions remain unanswered. Are you sure you want to end the exam?`);
      if (confirmSubmit) {
        showResults();
      }
    });

    // Load the first question
    loadQuestion(currentQuestionIndex);
  </script>
</body>
</html>
